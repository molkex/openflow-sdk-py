# Правила для агентов Manager (docs/AGENT_SYSTEM.md, раздел 7)
autonomy: 1            # 0 — только чтение; 1 — изменения только через PR; 2 — мелочь мержится сама; 3 — выкатка с автооткатом
branches: "agent/*"    # агенты работают только в таких ветках
protected: [main, master]
require_pr: true
require_owner_yes: [deploy, migrations, delete_data, secrets, payments, dns, open_ports]
owner_only:            # эти пути агенты не меняют и не анализируют глубже, чем нужно для обвязки
  - "openflow/wrappers.py"    # подменяет ANTHROPIC_API_KEY/OPENAI_API_KEY и base URL, чтобы coding-CLI (Claude Code, Codex, aider, Cursor) прозрачно шли через openFlow без упоминания upstream-провайдера
  - "openflow/client.py"    # маршрутизация запросов на конкретные аккаунты Google-пула (account_email / account_tag), т.е. распределение нагрузки по ферме аккаунтов
